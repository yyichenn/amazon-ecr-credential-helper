name: Live global token

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TEST_REGISTRY: 277125094980.dkr.ecr.us-west-2.amazonaws.com
  TEST_REPOSITORY: repro-k8s-global-token-cross-region-20261008
  TEST_TAG: repro-global-token-20261008
  TEST_IMAGE: 277125094980.dkr.ecr.us-west-2.amazonaws.com/repro-k8s-global-token-cross-region-20261008:repro-global-token-20261008

jobs:
  live:
    name: live (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: ecr-login/go.sum

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::277125094980:role/ecr-helper-gha-live-test-20261111
          aws-region: us-west-2
          role-session-name: ecr-helper-${{ matrix.os }}

      - name: Control without helper (Docker)
        if: runner.os != 'macOS'
        shell: pwsh
        run: |
          $controlConfig = Join-Path $env:RUNNER_TEMP "docker-control"
          New-Item -ItemType Directory -Force -Path $controlConfig | Out-Null
          "{}" | Set-Content -Encoding utf8 (Join-Path $controlConfig "config.json")
          docker --config $controlConfig pull $env:TEST_IMAGE
          if ($LASTEXITCODE -eq 0) {
            throw "Control pull unexpectedly succeeded without the helper"
          }
          Write-Output "CONTROL_RESULT=expected_failure"

      - name: Control without helper (registry API)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request

          url = (
              f"https://{os.environ['TEST_REGISTRY']}/v2/"
              f"{os.environ['TEST_REPOSITORY']}/manifests/{os.environ['TEST_TAG']}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.docker.distribution.manifest.v2+json"
              },
              method="GET",
          )
          try:
              urllib.request.urlopen(request)
          except urllib.error.HTTPError as error:
              if error.code not in (401, 403):
                  raise
              print(f"CONTROL_RESULT=expected_http_{error.code}")
          else:
              raise SystemExit("Control registry request unexpectedly succeeded")
          PY

      - name: Build and install helper (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/ecr-helper-bin"
          mkdir -p "$bin_dir"
          (
            cd ecr-login
            go build -mod=vendor \
              -o "$bin_dir/docker-credential-ecr-login" \
              ./cli/docker-credential-ecr-login
          )
          chmod 0755 "$bin_dir/docker-credential-ecr-login"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Build and install helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = Join-Path $env:RUNNER_TEMP "ecr-helper-bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Push-Location ecr-login
          try {
            go build -mod=vendor `
              -o (Join-Path $binDir "docker-credential-ecr-login.exe") `
              ./cli/docker-credential-ecr-login
          } finally {
            Pop-Location
          }
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure isolated Docker credentials (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          docker_config="$RUNNER_TEMP/docker-helper"
          mkdir -p "$docker_config"
          printf '{"credHelpers":{"%s":"ecr-login"}}\n' "$TEST_REGISTRY" \
            > "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
          echo "AWS_ECR_DISABLE_CACHE=true" >> "$GITHUB_ENV"

      - name: Configure isolated Docker credentials (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dockerConfig = Join-Path $env:RUNNER_TEMP "docker-helper"
          New-Item -ItemType Directory -Force -Path $dockerConfig | Out-Null
          $helpers = @{}
          $helpers[$env:TEST_REGISTRY] = "ecr-login"
          @{ credHelpers = $helpers } |
            ConvertTo-Json -Depth 3 |
            Set-Content -Encoding utf8 (Join-Path $dockerConfig "config.json")
          "DOCKER_CONFIG=$dockerConfig" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AWS_ECR_DISABLE_CACHE=true" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Unset/default and global-token pulls (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          unset AWS_ECR_PRIVATE_TOKEN_TYPE
          docker pull "$TEST_IMAGE"
          AWS_ECR_IGNORE_CREDS_STORAGE=true docker logout "$TEST_REGISTRY"

          export AWS_ECR_PRIVATE_TOKEN_TYPE=global-token
          docker pull "$TEST_IMAGE"
          AWS_ECR_IGNORE_CREDS_STORAGE=true docker logout "$TEST_REGISTRY"

      - name: Unset/default and global-token pulls (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Env:AWS_ECR_PRIVATE_TOKEN_TYPE -ErrorAction SilentlyContinue
          docker pull $env:TEST_IMAGE
          if ($LASTEXITCODE -ne 0) {
            throw "Unset/default Docker pull failed"
          }
          $env:AWS_ECR_IGNORE_CREDS_STORAGE = "true"
          docker logout $env:TEST_REGISTRY
          if ($LASTEXITCODE -ne 0) {
            throw "Unset/default Docker logout failed"
          }

          $env:AWS_ECR_PRIVATE_TOKEN_TYPE = "global-token"
          docker pull $env:TEST_IMAGE
          if ($LASTEXITCODE -ne 0) {
            throw "Global-token Docker pull failed"
          }
          docker logout $env:TEST_REGISTRY
          if ($LASTEXITCODE -ne 0) {
            throw "Global-token Docker logout failed"
          }

      - name: Unset/default and global-token registry API checks (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          check_registry() {
            lane="$1"
            token_type="$2"
            credential_file="$RUNNER_TEMP/credentials-$lane.json"

            if [ -n "$token_type" ]; then
              export AWS_ECR_PRIVATE_TOKEN_TYPE="$token_type"
            else
              unset AWS_ECR_PRIVATE_TOKEN_TYPE
            fi

            printf '%s' "$TEST_REGISTRY" |
              docker-credential-ecr-login get > "$credential_file"

            python3 - "$credential_file" <<'PY'
          import base64
          import json
          import os
          import sys
          import urllib.request

          credential_path = sys.argv[1]
          with open(credential_path, encoding="utf-8") as credential_stream:
              credential = json.load(credential_stream)

          basic = base64.b64encode(
              f"{credential['Username']}:{credential['Secret']}".encode()
          ).decode()
          url = (
              f"https://{os.environ['TEST_REGISTRY']}/v2/"
              f"{os.environ['TEST_REPOSITORY']}/manifests/{os.environ['TEST_TAG']}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.docker.distribution.manifest.v2+json",
                  "Authorization": f"Basic {basic}",
              },
              method="GET",
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 200:
                  raise SystemExit(f"Unexpected registry status {response.status}")
              print("REGISTRY_API_STATUS=200")
          PY

            rm -f "$credential_file"
            printf '%s' "$TEST_REGISTRY" |
              AWS_ECR_IGNORE_CREDS_STORAGE=true \
                docker-credential-ecr-login erase
          }

          check_registry unset ""
          check_registry global global-token
